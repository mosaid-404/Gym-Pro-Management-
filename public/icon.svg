<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0A0A0A"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#a3e635" stroke-width="8" stroke-opacity="0.3"/>
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
  <!-- Dumbbell Icon Path -->
  <g fill="url(#gymGrad)" transform="translate(64, 64) scale(0.75)">
    <!-- Left Weight -->
    <rect x="40" y="140" width="48" height="232" rx="20" fill="url(#gymGrad)"/>
    <rect x="96" y="170" width="36" height="172" rx="14" fill="url(#gymGrad)"/>
    <!-- Center Bar -->
    <rect x="132" y="232" width="248" height="48" rx="12" fill="url(#gymGrad)"/>
    <!-- Right Weight -->
    <rect x="380" y="170" width="36" height="172" rx="14" fill="url(#gymGrad)"/>
    <rect x="424" y="140" width="48" height="232" rx="20" fill="url(#gymGrad)"/>
  </g>
</svg>
